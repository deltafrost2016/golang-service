name: Security & Dependency Audit

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Fails the job on known vulnerabilities in the module graph.
      - name: govulncheck
        run: govulncheck ./...

      - name: Dependency staleness report
        if: always()
        run: go list -u -m all || true
