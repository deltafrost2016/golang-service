name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # No test files exist yet in this project — this reports "no test files" harmlessly
      # rather than failing. Add tests under internal/**, then this gate starts enforcing them.
      - name: Test with coverage
        run: go test ./... -cover
